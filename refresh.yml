name: Refresh Dashboard-Marion

on:
  schedule:
    # tous les jours à 6h00 UTC (7h/8h heure française selon saison)
    - cron: "0 6 * * *"
  workflow_dispatch: {}   # permet aussi de le lancer manuellement depuis l'onglet "Actions" de GitHub

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Installer les dépendances
        run: pip install -r requirements.txt

      - name: Écrire les identifiants Google (secret GitHub)
        env:
          GOOGLE_SERVICE_ACCOUNT_JSON: ${{ secrets.GOOGLE_SERVICE_ACCOUNT_JSON }}
        run: |
          printf '%s' "$GOOGLE_SERVICE_ACCOUNT_JSON" > service-account.json
          python -c "import json; json.load(open('service-account.json'))" \
            && echo "service-account.json est un JSON valide" \
            || (echo "::error::le secret GOOGLE_SERVICE_ACCOUNT_JSON ne contient pas un JSON valide" && exit 1)

      - name: Écrire la config
        run: |
          cat > config.json << EOF
          {
            "service_account_json": "service-account.json",
            "sheet_id": "${{ secrets.SHEET_ID }}",
            "drive_folder_id": "${{ secrets.DRIVE_FOLDER_ID }}"
          }
          EOF

      - name: Lancer le refresh
        run: python refresh.py

      - name: Nettoyer les identifiants
        if: always()
        run: rm -f service-account.json config.json

      - name: Publier si le dashboard a changé
        run: |
          git config user.name "dashboard-marion-bot"
          git config user.email "actions@github.com"
          git add dashboard-marion.html monthly_data.json
          if ! git diff --cached --quiet; then
            git commit -m "Refresh auto $(date -u '+%Y-%m-%d %H:%M UTC')"
            git push
          else
            echo "Rien de nouveau à publier."
          fi
